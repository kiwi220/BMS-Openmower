# JK-BMS BLE node configuration
bms_mac_address: "AA:BB:CC:DD:EE:FF"   # BLE MAC of the JK-BMS (bluetoothctl scan on)
publish_rate_hz: 1.0
cell_count: 7
nominal_capacity_ah: 10.0

# Optional
ble_connect_password: ""        # not sent on BLE level (see README), kept for completeness
openmower_status_topic: ""      # e.g. "/ll/bms" -> additionally publish mower_msgs/Bms
battery_state_topic: "/battery_state"
protocol: "auto"                # auto | JK02_32S | JK02_24S (auto: from firmware version)
frame_id: "battery"
publish_diagnostics: true
reconnect_interval_s: 5.0
stale_timeout_s: 30.0           # after this outage: power_supply_health = UNKNOWN
data_timeout_s: 10.0            # re-request cell info if the stream stalls
